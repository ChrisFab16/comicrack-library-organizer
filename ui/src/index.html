<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Library Organizer Configure</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header>
    <h1>Library Organizer</h1>
    <p id="hostMeta" class="meta">Connecting…</p>
  </header>
  <main>
    <section>
      <h2>Profiles</h2>
      <ul id="profiles"></ul>
    </section>
    <section id="overview" class="card">
      <h2>Overview</h2>
      <p class="hint">Phase B — edit overview for the selected profile. Files/Folders/Rules still use classic Configure.</p>
      <label>Base folder
        <input id="baseFolder" type="text" />
      </label>
      <fieldset>
        <legend>Mode</legend>
        <label><input type="radio" name="mode" value="Move" /> Move</label>
        <label><input type="radio" name="mode" value="Copy" /> Copy</label>
        <label><input type="radio" name="mode" value="Simulate" /> Simulate</label>
      </fieldset>
      <label class="check"><input id="useFolder" type="checkbox" /> Organize into folders</label>
      <label class="check"><input id="useFileName" type="checkbox" /> Rename files</label>
      <label class="check"><input id="copyMode" type="checkbox" /> Copy custom thumbnails / related (copy mode)</label>
      <label class="check"><input id="moveFileless" type="checkbox" /> Move fileless books</label>
    </section>
    <section class="actions">
      <button type="button" id="btnSave">Save overview</button>
      <button type="button" id="btnClassic" class="secondary">Open classic Configure…</button>
      <button type="button" id="btnClose" class="secondary">Close</button>
    </section>
  </main>
  <script src="./host-bridge.js"></script>
  <script src="./app.js"></script>
</body>
</html>
